<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Music</title>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #ffffff;
    --accent: #1db954;
    --danger: #e53935;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
  h1 { font-size: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  
  .player-box {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  .controls { display: flex; gap: 8px; margin-bottom: 16px; }
  button {
    background: var(--card); color: var(--text); border: 1px solid #333;
    padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  button:active { opacity: 0.7; }
  .btn-primary { background: var(--accent); color: #000; border: none; }
  .btn-lock { margin-left: auto; background: #2c2c2c; }

  .add-form { display: flex; flex-direction: column; gap: 8px; background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 16px; }
  input {
    background: #2a2a2a; border: 1px solid #444; color: var(--text);
    padding: 10px; border-radius: 8px; font-size: 14px;
  }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); padding: 12px; border-radius: 10px;
  }
  .item.active { border-left: 4px solid var(--accent); background: #252525; }
  .item-title { font-size: 14px; flex: 1; padding-right: 10px; word-break: break-all; }
  .btn-del { background: transparent; color: var(--danger); border: none; padding: 6px; font-size: 13px; }

  #sleep-cover {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000000; z-index: 9999; flex-direction: column;
    justify-content: center; align-items: center; color: #333; text-align: center;
  }
</style>
</head>
<body>

  <h1>
    <span>My Music</span>
    <button class="btn-lock" onclick="toggleCover(true)">🌙 省電力カバー</button>
  </h1>

  <div class="player-box">
    <div id="player"></div>
  </div>

  <div class="controls">
    <button onclick="prevTrack()">⏮ 前へ</button>
    <button class="btn-primary" onclick="nextTrack()">⏭ 次の曲</button>
  </div>

  <div class="add-form">
    <input type="text" id="songTitle" placeholder="曲名（空欄ならIDを表示）">
    <input type="text" id="youtubeUrl" placeholder="YouTubeのURLを貼り付け">
    <button class="btn-primary" onclick="addSong()">＋ リストに追加</button>
  </div>

  <div class="list" id="playlist"></div>

  <div id="sleep-cover" ondblclick="toggleCover(false)">
    <p>省電力モード中</p>
    <p style="font-size:12px; margin-top:8px;">画面をダブルタップで解除</p>
  </div>

<script>
  let playlist = JSON.parse(localStorage.getItem('myYtPlaylist')) || [
    { id: 'jfKfPfyJRdk', title: 'lofi hip hop radio (サンプル)' }
  ];
  let currentIndex = 0;
  let player;

  const tag = document.createElement('script');
  tag.src = "https://youtube.com_" + "api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: playlist.length > 0 ? playlist[0].id : '',
      playerVars: { 'playsinline': 1, 'rel': 0 },
      events: {
        'onStateChange': onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
      nextTrack();
    }
  }

  function extractVideoID(url) {
    const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
    const match = url.match(regExp);
    return match ? match[1] : null;
  }

  function addSong() {
    const urlInput = document.getElementById('youtubeUrl');
    const titleInput = document.getElementById('songTitle');
    const videoId = extractVideoID(urlInput.value.trim());

    if (!videoId) {
      alert('有効なYouTubeのURLを入力してください');
      return;
    }

    const title = titleInput.value.trim() || `YouTube動画 (${videoId})`;
    playlist.push({ id: videoId, title: title });
    saveAndRender();

    if (playlist.length === 1 && player) {
      player.loadVideoById(videoId);
    }
    urlInput.value = '';
    titleInput.value = '';
  }

  function deleteSong(index, event) {
    event.stopPropagation();
    playlist.splice(index, 1);
    if (currentIndex >= playlist.length) currentIndex = 0;
    saveAndRender();
  }

  function playSong(index) {
    currentIndex = index;
    if (player && playlist[currentIndex]) {
      player.loadVideoById(playlist[currentIndex].id);
    }
    renderList();
  }

  function nextTrack() {
    if (playlist.length === 0) return;
    currentIndex = (currentIndex + 1) % playlist.length;
    playSong(currentIndex);
  }

  function prevTrack() {
    if (playlist.length === 0) return;
    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
    playSong(currentIndex);
  }

  function saveAndRender() {
    localStorage.setItem('myYtPlaylist', JSON.stringify(playlist));
    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('playlist');
    listEl.innerHTML = '';
    playlist.forEach((song, idx) => {
      const div = document.createElement('div');
      div.className = 'item' + (idx === currentIndex ? ' active' : '');
      div.onclick = () => playSong(idx);
      div.innerHTML = `
        <span class="item-title">${idx === currentIndex ? '▶ ' : ''}${song.title}</span>
        <button class="btn-del" onclick="deleteSong(${idx}, event)">削除</button>
      `;
      listEl.appendChild(div);
    });
  }

  function toggleCover(show) {
    document.getElementById('sleep-cover').style.display = show ? 'flex' : 'none';
  }

  renderList();
</script>
</body>
</html>
